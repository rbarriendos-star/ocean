<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Océano de sabores</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#d8d5cd;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;font-family:"Cormorant Garamond",Georgia,serif;color:#26262a}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#v{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(60,58,50,.2))}
#count{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:calc(env(safe-area-inset-left,0px) + 18px);font-size:28px;font-style:italic;text-shadow:0 0 8px #f2f0ea;pointer-events:none}
#count small{display:block;font-size:13px;font-style:normal;opacity:.6}
.glass{background:rgba(250,248,242,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(38,38,42,.28);box-shadow:0 6px 24px rgba(0,0,0,.08)}
#bub{position:fixed;left:0;top:0;width:min(270px,72vw);box-sizing:border-box;padding:14px 22px 16px;border-radius:56% 44% 52% 48%/48% 54% 46% 52%;opacity:0;pointer-events:none;transition:opacity .4s;font-size:20px;line-height:1.25;text-align:center;font-style:italic}
#bub.on{opacity:1;pointer-events:auto}
#bub b{display:block;font-size:14px;font-style:normal;margin-bottom:3px;opacity:.65}
#bub span{display:block;animation:f .6s}
@keyframes f{from{opacity:0}}
.rc{font-size:15px;width:20em;height:33em;box-sizing:border-box;padding:1.25em;border-radius:1.2em;background:#faf8f2;border:1px solid rgba(38,38,42,.45);box-shadow:inset 0 0 0 .3em #faf8f2,inset 0 0 0 .38em var(--ac),0 .5em 2em rgba(0,0,0,.2);display:flex;flex-direction:column;text-align:center;overflow:hidden}
.rc .art{height:7.5em;flex:none;margin-bottom:.7em;border-radius:.8em;border:1px solid rgba(38,38,42,.25)}
.rc svg{width:100%;height:100%;display:block}
.rc h2{margin:0 0 .45em;font-size:1.5em;line-height:1.1;font-style:italic;font-weight:500}
.rc em{display:block;font-size:1em;opacity:.65;margin:-.15em 0 .5em}
.rc p{margin:0 0 .6em;font-size:1.1em;line-height:1.28}
.rc .ing{margin-top:auto;font-size:.95em;border-top:.15em solid var(--ac);padding-top:.5em}
#card{position:fixed;left:50%;top:46%;z-index:8;transform:translate(-50%,-40%) scale(.92);opacity:0;transition:transform .8s cubic-bezier(.5,0,.2,1),opacity .8s;pointer-events:none;cursor:pointer}
#card.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
#card .rc{font-size:min(15px,4.5vw,2.4vh)}
.x{position:absolute;top:-12px;right:-12px;width:32px;height:32px;padding:0;border-radius:50%;border:1px solid rgba(38,38,42,.4);background:#faf8f2;color:#26262a;font:22px/28px Georgia,serif;cursor:pointer}
#stack,#stack2{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 84px);left:calc(env(safe-area-inset-left,0px) + 22px);width:52px;height:86px;display:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
#stack .sc,#stack2 .sc{position:absolute;inset:0;box-sizing:border-box;padding:7px;border-radius:8px;background:#faf8f2;border:1px solid rgba(38,38,42,.45);box-shadow:inset 0 0 0 3px #faf8f2,inset 0 0 0 4px var(--ac),0 2px 6px rgba(0,0,0,.18);transition:opacity .5s}
#stack .sc.pend,#stack2 .sc.pend{opacity:0}
#stack2{top:calc(env(safe-area-inset-top,0px) + 196px)}
#stack svg,#stack2 svg{width:100%;height:100%;display:block}
#stack .n,#stack2 .n{position:absolute;right:-9px;bottom:-9px;width:22px;height:22px;border-radius:50%;background:#26262a;color:#f2f0ea;font:normal 13px/22px Georgia,serif;text-align:center}
#deck{position:fixed;inset:0;z-index:9;box-sizing:border-box;overflow-y:auto;touch-action:pan-y;background:rgba(242,240,234,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .4s;padding:calc(env(safe-area-inset-top,0px) + 22px) 16px calc(env(safe-area-inset-bottom,0px) + 30px)}
#deck.on{opacity:1;pointer-events:auto}
#deck .x{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px}
#deck .dh{text-align:center;font-size:28px;font-style:italic;margin:6px 0 18px}
#deck .dg{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
#deck .dc,#deck .dp{cursor:pointer;animation:pop .6s both;animation-delay:var(--d)}
#deck .rc{font-size:clamp(8px,2.1vw,11px)}
@keyframes pop{from{opacity:0;transform:translate(-40px,-80px) scale(.4) rotate(-8deg)}}
#welcome{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:calc(env(safe-area-inset-top,0px) + 24px) 28px calc(env(safe-area-inset-bottom,0px) + 24px);background:rgba(242,240,234,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:opacity 1.1s;text-align:center;touch-action:none}
#welcome.off{opacity:0;pointer-events:none}
#welcome .wb{max-width:420px}
#welcome svg{width:84px;height:84px;margin-bottom:10px}
#welcome h1{margin:0 0 14px;font-size:clamp(34px,8vw,48px);font-weight:500;font-style:italic;line-height:1.05}
#welcome p{margin:0 0 12px;font-size:clamp(19px,4.6vw,22px);line-height:1.35}
#welcome button{margin-top:14px;padding:12px 32px;border-radius:40px 34px 42px 36px;border:1px solid #26262a;background:transparent;color:#26262a;font:italic 500 24px 'Cormorant Garamond',Georgia,serif;cursor:pointer;transition:background .3s}
#welcome button:hover{background:rgba(255,255,255,.6)}
#snd{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 14px);width:40px;height:40px;border-radius:50%;border:1px solid rgba(38,38,42,.35);background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);color:#26262a;font:20px/36px Georgia,serif;padding:0;cursor:pointer;display:none;opacity:.6}
#snd.m{opacity:.3;text-decoration:line-through}
.rc.t{height:auto}.rc.t p{font-size:1.15em;margin:0 0 .7em}.rc.t h2{margin-bottom:.6em}
#act,#act2{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);display:none;padding:10px 28px;border-radius:30px 26px 32px 28px;border:1px solid rgba(38,38,42,.5);background:rgba(250,248,242,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#26262a;font:italic 500 22px 'Cormorant Garamond',Georgia,serif;cursor:pointer}
#act2{bottom:calc(env(safe-area-inset-bottom,0px) + 82px)}
.touch #act,.touch #act2{left:auto;transform:none;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 122px)}
.touch #act2{bottom:calc(env(safe-area-inset-bottom,0px) + 176px)}
#map{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 62px);width:120px;height:120px;border-radius:14px 22px 16px 24px;border:1px solid rgba(38,38,42,.35);background:rgba(250,248,242,.55);display:none;cursor:pointer}
#joy{position:fixed;z-index:6;left:calc(env(safe-area-inset-left,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:120px;height:120px;border-radius:50%;border:1px solid rgba(38,38,42,.35);background:rgba(255,255,255,.18);display:none;touch-action:none}
#joy i{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(38,38,42,.35)}
.touch.walk #joy{display:block}.walk .ar{display:none!important}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);text-align:center;font-size:19px;font-style:italic;text-shadow:0 0 8px #f2f0ea;opacity:0;transition:opacity 1.5s;pointer-events:none;padding:0 70px}
#hint.on{opacity:.85}
.ar{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:64px;height:64px;border-radius:50%;border:1px solid rgba(38,38,42,.35);display:none;align-items:center;justify-content:center;font-size:38px;opacity:.5;touch-action:none;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.touch .ar{display:flex}.ar.p{opacity:1;background:rgba(255,255,255,.6)}
#al{left:calc(env(safe-area-inset-left,0px) + 20px)}#ar{left:calc(env(safe-area-inset-left,0px) + 98px)}
#wd{right:calc(env(safe-area-inset-right,0px) + 20px);width:88px;height:88px;font-size:19px;font-style:italic}
.touch #hint{bottom:calc(env(safe-area-inset-bottom,0px) + 126px);padding:0 24px}
</style></head><body>
<canvas id="c"></canvas><div id="v"></div>
<div id="count">0 / 13<small>platos descubiertos</small></div>
<div id="bub" class="glass"></div><div id="card"></div><div id="hint"></div><div id="stack" title="Recetas"></div><div id="stack2" title="Tripulación"></div><div id="deck"></div>
<canvas id="map" width="240" height="240"></canvas><div id="joy"><i></i></div><button id="act"></button><button id="act2"></button><button id="snd" aria-label="Música">♪</button><div id="welcome"><div class="wb"><svg viewBox="0 0 84 84" fill="none" stroke="#26262a" stroke-width="1.4" stroke-linejoin="round"><path d="M42 8C54 22 54 56 48 72Q42 78 36 72C30 56 30 22 42 8Z" fill="#faf8f2"/><path d="M42 36Q58 46 50 64Q44 52 42 36Z" fill="#fff"/><circle cx="42" cy="36" r="3" fill="#26262a"/><path d="M12 30q5-4 10 0M62 56q5-4 10 0M16 62q5-4 10 0" opacity=".4"/></svg><h1>Bienvenido, tripulante</h1><p>Gracias por regalarnos este rato. Hemos preparado para hoy un pequeño mundo de sabores: un océano por descubrir, con islas que guardan platos y sorpresas.</p><p>Deja que el viento te lleve. El viaje empieza cuando quieras.</p><button id="go">Comenzar el viaje</button></div></div>
<div class="ar" id="al">‹</div><div class="ar" id="ar">›</div><div class="ar" id="wd">viento</div>
<script>
/* ===== CONTENIDO: edita aquí platos y criaturas ===== */
const DATA={world:6000,start:{x:700,y:3000},
islands:[
{name:'Golcappa rellena de carbonara de guanciale',short:'Golcappa',x:1500,y:2750,r:140,seed:3,desc:'La cremosidad y el carácter de la carbonara romana encerrados en un bocado crujiente por fuera y fundente por dentro.',ingredients:['guanciale','huevos','queso parmesano'],colors:{sand:'#f5ead0',land:'#e9c46a',hill:'#c0623c'}},
{name:'Solomillo marinado sobre tostada con foie y mermelada',short:'Solomillo con foie',x:2100,y:2150,r:145,seed:7,desc:'Un contraste elegante y goloso donde la jugosidad del cerdo se abraza con la untuosidad del foie y el toque dulce de la mermelada sobre pan crujiente.',ingredients:['solomillo de cerdo','foie','mermelada','tostada o pan para servir'],colors:{sand:'#efdcc4',land:'#b5654a',hill:'#6e2c3a'}},
{name:'Edamame flambeadas',short:'Edamame flambeadas',x:2300,y:3350,r:130,seed:11,desc:'Un aperitivo vibrante y aromático que mezcla el toque ahumado del flambeado con el dulzor meloso del ron, el punto salino de la soja y la frescura cítrica de la lima.',ingredients:['edamame','salsa teriyaki','ron miel','salsa de soja','lima','sal gorda o escamas de sal'],colors:{sand:'#e6efcf',land:'#8fc26a',hill:'#3f7a3a'}},
{name:'Gyoza de pollo tikka con salsa de mango y coco',short:'Gyoza tikka',x:2900,y:2500,r:150,seed:19,desc:'Empanadillas orientales especiadas al estilo tikka que se encuentran con una salsa tropical sedosa y exótica de mango y coco.',ingredients:['masa de gyoza','pechuga de pollo','leche de coco','yogur griego','limón','salsa de tomate','cebolla','salsa de mango y coco','mango','ajos'],colors:{sand:'#fbe9c8',land:'#f2a33a',hill:'#c4561f'}},
{name:'Galletas de berenjena con tomate y pesto',short:'Galletas de berenjena',x:1800,y:3900,r:135,seed:23,desc:'Un juego de texturas muy apetecible entre la suavidad de la berenjena, el crujiente de la galleta y el frescor herbal del tomate con pesto.',ingredients:['berenjena','galletas','tomate natural','albahaca','piñones'],colors:{sand:'#e9e0ea',land:'#7a5a8c',hill:'#4a2f5e'}},
{name:'Rollitos de gambas, mango, lima y aguacate en papel de arroz',short:'Rollitos de gambas',x:3200,y:3700,r:140,seed:29,desc:'Un bocado fresco, colorido y tropical donde la dulzura del mango y la cremosidad del aguacate realzan las gambas con un golpe cítrico de lima.',ingredients:['gambas','mango','lima','aguacate','cebollino','ajetes','papel de arroz'],colors:{sand:'#f6f1d4',land:'#a8cf6a',hill:'#e8765a'}},
{name:'Tartar de salmón',short:'Tartar de salmón',x:3500,y:1850,r:140,seed:31,desc:'Un clásico fresco y limpio, con contraste salino y aromático, ideal para abrir apetito con elegancia.',ingredients:['salmón','aguacate','cebolla dulce','alcaparras'],colors:{sand:'#fde4d6',land:'#f48c6a',hill:'#d2553f'}},
{name:'Ravioli de calabacín relleno de carne picada',short:'Ravioli de calabacín',x:4000,y:2950,r:150,seed:37,desc:'Láminas ligeras de calabacín que sustituyen a la pasta tradicional para envolver un relleno jugoso y reconfortante.',ingredients:['calabacines largos','carne picada','ricotta','zanahoria','cebolla dulce','cebollino','tomate'],colors:{sand:'#e8f0d8',land:'#9cc47a',hill:'#b8472f'}},
{name:'Tarta Tatín de puerros',short:'Tatín de puerros',x:2800,y:4500,r:140,seed:41,desc:'Una vuelta salada y caramelizada al clásico francés, aprovechando la dulzura suave de los puerros bajo un hojaldre dorado y crujiente.',ingredients:['puerros','hojaldre','miel','burrata (opcional)'],colors:{sand:'#f7ecc9',land:'#c9d37a',hill:'#c58a2d'}},
{name:'Crepes de calabaza con conejo escabechado',short:'Crepes de calabaza',x:4300,y:2000,r:145,seed:43,desc:'Una propuesta de contrastes muy original: la suavidad dulce y otoñal de la calabaza junto a un guiso de conejo tierno y lleno de matices.',ingredients:['calabaza','conejo escabechado','huevos','harina','leche','levadura','limón'],colors:{sand:'#fbe5c0',land:'#f0a24a',hill:'#8a4b24'}},
{name:'Milhojas de boniato, brie y jamón',short:'Milhojas de boniato',x:4600,y:3900,r:150,seed:47,desc:'Capas dulces y fundentes de boniato y brie intercaladas con el punto salado y sabroso del jamón.',ingredients:['boniato','queso brie','jamón','base tipo galleta o masa'],colors:{sand:'#f8ecd8',land:'#d9803f',hill:'#b23a48'}},
{name:'Lomo a la baturra',short:'Lomo a la baturra',x:5000,y:2700,r:150,seed:53,desc:'Un plato tradicional con carácter y sabor de cuchara y sartén, de aire casero y contundente.',ingredients:['filetes finos de lomo','huevos','harina','cebolla','tomate frito','vino tinto','caldo de pollo','aceitunas','lonchas de jamón'],colors:{sand:'#f1e0c8',land:'#c9573f',hill:'#6d2f2a'}},
{name:'Súper granos de café',short:'Súper granos de café',x:3900,y:4600,r:135,seed:59,desc:'El cierre dulce perfecto: capas suaves y cremosas con el toque intenso del café para rematar la mesa.',ingredients:['bizcochos de soletilla','mascarpone','café'],colors:{sand:'#f1e6d6',land:'#a1714b',hill:'#4a2c1c'}}],
creatures:[
{name:'Kraken',type:'kraken',sz:1.4,x:1000,y:3500,col:'#b04a6e',lines:['¡Cuidado con los brazos! Tengo ocho y todos quieren cocinar a la vez.','Uno corta la cebolla, otro remueve la salsa, otro prueba… y los otros cinco te saludan.','Mi receta secreta: pescado fresquísimo, limón y mucha paciencia.','Por tu camino hay una isla de salmón. Pregunta por el tartar.']},
{name:'Leviatán',type:'leviathan',sz:1.5,x:3100,y:3050,col:'#3d7fb5',lines:['Mmm… ¿eso es un barco o un aperitivo?','Tranquilo, solo tengo hambre. Una hambre del tamaño del océano.','Ayer me comí cien mareas y todavía me ruge el estómago. ¿Te sobra algo?','Un bocado de boniato y brie me calmaría un siglo. Quizá dos.']},
{name:'Cthulhu',type:'cthulhu',sz:1.3,x:5300,y:3400,col:'#6a9a5a',lines:['Ia, ia… perdona, estaba pidiendo la carta en mi idioma.','Mi plato favorito brilla en la oscuridad y se mueve un poco. Lo llamamos «sorpresa».','Lo más raro que he probado aquí: edamame flambeado. ¡Arde y encima es verde!','Prométeme una cosa: si algo de tu plato te guiña un ojo, no preguntes.']},
{name:'Nessie',type:'nessie',sz:1.3,x:3000,y:1500,col:'#5fa8a0',lines:['Shhh… no hagas ruido, que hay turistas mirando.','Dicen que me alimento de peces, algas y de la curiosidad de los visitantes.','Hoy llevo trucha, anguila y un poquito de alga rizada. Una dieta equilibrada.','Entre nosotros: lo que más me gusta es la lubina. Sin espinas, por favor.']},
{name:'Megalodón',type:'megalodon',sz:1.6,x:3900,y:3800,col:'#8aa3b8',lines:['Veinte metros de dientes y cero modales. Encantado.','Soy un depredador de la vieja escuela: primero huelo, luego pienso, luego como.','Mi consejo para cualquier cena: nunca te fíes de un tiburón que dice estar a dieta.','Aunque a veces me conformo con unas gambas bien hechas. Los clásicos no fallan.']},
{name:'Escila',type:'scylla',sz:1.3,x:2500,y:2850,col:'#c9703a',lines:['Somos muchas bocas, ¿sabes? Y ninguna se pone de acuerdo.','Una pide dulce, otra pide salado, otra solo quiere crujiente… y otra reclama postre.','Cenar en mi cueva es un caos delicioso: diez menús a la vez.','Por eso me encanta este lugar. Hay un plato para cada una de mis bocas.']},
{name:'Caribdis',type:'charybdis',sz:1.2,sp:3,x:3700,y:2400,col:'#3aa0c8',lines:['Glu, glu, glu… ¡perdona! Me estaba tragando medio océano.','Bebo agua tres veces al día. Las cantidades no te las digo, me da vergüenza.','Las recetas siempre piden «un vaso», «dos tazas»… ¡Qué cantidades tan pequeñas!','Eso sí: para mí, un remolino entero es un sorbito.']},
{name:'Poseidón',type:'poseidon',sz:1.3,sp:5,x:4600,y:3300,col:'#2f6fb0',lines:['¡Alza tu copa, navegante! Hoy el océano celebra un banquete.','En el Olimpo se come ambrosía; en mis aguas, lo mejor del mar y de la tierra.','Una mesa divina necesita tres cosas: buen pan, buen vino y buena compañía.','Tú, que has llegado hasta aquí, mereces un asiento en mi mesa.']},
{name:'Las Sirenas',type:'sirens',sz:1.2,x:2500,y:4050,col:'#d78ac0',lines:['Ssshhh… ven, ven, no te asustes. Solo queremos hablar de cocina.','Aquí abajo cocinamos con corrientes: no hay fuego, pero sí mucho mimo.','Nuestros platos favoritos: algas crujientes, perlas de limón y espuma de mar.','Y cantamos mientras cocinamos. ¡Por eso las recetas salen siempre afinadas!']},
{name:'Atómico, el lagarto radiactivo',type:'lizard',sz:1.4,x:5200,y:1800,col:'#9be04a',lines:['¡Cuidado con el aliento! Hoy he comido algo muy picante.','Todo lo que cocino sale con un brillo verde. Dicen que es radiactivo; yo digo que es decoración.','Mi plato favorito: una tonelada de croquetas calentadas con un solo estornudo.','Si tu salsa brilla en la oscuridad, tranquilo: está en su punto.']}]};
DATA.creatures=[]; /* monstruos retirados */
/* ===== MOTOR ===== */
const INK='#26262a',$=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
const touch=matchMedia('(pointer:coarse)').matches;if(touch)document.body.classList.add('touch');
let W,H,dpr,zoom,t=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;zoom=Math.max(.75,Math.min(W,H)/500)}
addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),angd=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));
const hash=(a,b)=>{const s=Math.sin(a*127.1+b*311.7)*43758.5453;return s-Math.floor(s)};
function rnd(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
/* niebla */
const FS=20,FO=-1500,FN=Math.ceil((DATA.world+3000)/FS),fog=document.createElement('canvas');fog.width=fog.height=FN;
const fx=fog.getContext('2d');fx.fillStyle='#d8d5cd';fx.fillRect(0,0,FN,FN);
function reveal(x,y){const px=(x-FO)/FS,py=(y-FO)/FS,r=300/FS,g=fx.createRadialGradient(px,py,0,px,py,r);fx.globalCompositeOperation='destination-out';g.addColorStop(0,'#000');g.addColorStop(.55,'#000');g.addColorStop(1,'rgba(0,0,0,0)');fx.fillStyle=g;fx.beginPath();fx.arc(px,py,r,0,7);fx.fill()}
/* islas */

function showFin(){const w=$('welcome'),sv=w.querySelector('svg');welcomeOn=1;w.innerHTML='<div class="wb">'+(sv?sv.outerHTML:'')+'<h1>¡Enhorabuena, navegante!</h1><p>Has llegado al final de la aventura. Trece islas, trece sabores y un mar entero recorrido con el viento a tu favor… y, a veces, en contra.</p><p>Esperamos que hayas disfrutado de este viaje con nosotros tanto como nosotros al prepararlo. Detrás de cada plato que has descubierto hay cariño, manos y muchas ganas de compartirlo contigo.</p><p>Gracias por navegar a nuestro lado. Ojalá te lleves un buen recuerdo… y un poquito de hambre.</p><button id="go2">Si quieres seguir navegando, pulsa aquí</button></div>';$('go2').onclick=()=>{welcomeOn=0;w.classList.add('off');fin=1;setHint('Navega con calma. Cerca de una isla podrás «Investigar» y desembarcar. Arriba tienes el plano del mar.',9000)};w.classList.remove('off')}
function discover(i){i.found=true;i.rip=0;chime();cnt.nodeValue=(++count)+' / '+N;setTimeout(()=>showCard(i),1400)}
/* simulación */
function update(dt){
if(busy)return;if(mode==='land'){updLand(dt);return}if(mode==='dive'){updDive(dt);return}
const turn=(keys.l||ptr.l?-1:0)+(keys.r||ptr.r?1:0);
S.hv+=(turn*1.1-S.hv)*Math.min(1,dt*2.2);S.h+=S.hv*dt;
gust=1+.25*Math.sin(t*.45)+.15*Math.sin(t*1.7);
windOn+=((keys.w||ptr.w?1:0)-windOn)*Math.min(1,dt*2.5);
const th=(105+20*(1+Math.cos(S.h))/2)*gust*windOn,dg=.5+.4*windOn;
S.vx+=(Math.cos(S.h)*th+10*gust*windOn-dg*S.vx)*dt;S.vy+=(Math.sin(S.h)*th-dg*S.vy)*dt;
S.x+=S.vx*dt;S.y+=S.vy*dt;
if(S.x<300||S.x>DATA.world-300){S.x=clamp(S.x,300,DATA.world-300);S.vx=0}if(S.y<300||S.y>DATA.world-300){S.y=clamp(S.y,300,DATA.world-300);S.vy=0}
DATA.islands.forEach(i=>{const dx=S.x-i.x,dy=S.y-i.y,d=Math.hypot(dx,dy);
if(d<i.r*.9+14){S.x=i.x+dx/d*(i.r*.9+14);S.y=i.y+dy/d*(i.r*.9+14);S.vx*=.6;S.vy*=.6}
if(d<i.r+300)i.seen=Math.min(1,i.seen+dt*.8);if(!i.found&&d<i.r+130)discover(i);
if(i.found){i.c=Math.min(1,i.c+dt*.7);i.rip+=dt}});
reveal(S.x,S.y);
S.wt+=dt;if(S.wt>.07&&Math.hypot(S.vx,S.vy)>12){S.wt=0;S.wake.push({x:S.x-Math.cos(S.h)*20,y:S.y-Math.sin(S.h)*20,a:0});if(S.wake.length>45)S.wake.shift()}
S.wake.forEach(w=>w.a+=dt);while(S.wake.length&&S.wake[0].a>3)S.wake.shift();
cam.x+=(S.x+S.vx*.5-cam.x)*Math.min(1,dt*2.5);cam.y+=(S.y+S.vy*.5-cam.y)*Math.min(1,dt*2.5);
DATA.creatures.forEach(k=>{const dx=S.x-k.x,dy=S.y-k.y,d=Math.hypot(dx,dy);let ta,sp=k.v;
k.wa+=(Math.random()-.5)*dt*2;
if(k.state==='talk'){ta=Math.atan2(dy,dx);sp=0}
else if(k.cool>0){k.cool-=dt;ta=d<500?Math.atan2(-dy,-dx):k.wa;sp=d<500?26:k.v}
else if(d<420&&d>130+k.s*40){ta=Math.atan2(dy,dx);sp=28}
else{ta=Math.hypot(k.hx-k.x,k.hy-k.y)>260?Math.atan2(k.hy-k.y,k.hx-k.x):k.wa}
k.a+=angd(ta,k.a)*Math.min(1,dt*2.5);k.x+=Math.cos(k.a)*sp*dt;k.y+=Math.sin(k.a)*sp*dt;
k.c+=((k.met?1:0)-k.c)*Math.min(1,dt*1.5);
if(k.state==='idle'&&k.cool<=0&&d<150+k.s*40&&!talk)startTalk(k)});
if(talk){talk.t+=dt;if(talk.t>3.4+talk.lines[talk.i].length*.04)nextLine()}
}
/* dibujo */
function hull(){ctx.beginPath();ctx.moveTo(28,0);ctx.bezierCurveTo(16,-10,-4,-11,-18,-7);ctx.quadraticCurveTo(-23,0,-18,7);ctx.bezierCurveTo(-4,11,16,10,28,0);ctx.closePath()}
function drawShip(){const bob=Math.sin(t*1.6)*.03+Math.sin(t*2.7)*.015;
ctx.save();ctx.translate(S.x,S.y);ctx.rotate(S.h+bob);const sc=1.1*(1+Math.sin(t*1.6)*.015);ctx.scale(sc,sc*(1-Math.abs(S.hv)*.06));
ctx.save();ctx.translate(3+S.hv*3,5);ctx.fillStyle='rgba(0,0,0,.13)';hull();ctx.fill();ctx.restore();
ctx.fillStyle='#faf8f2';ctx.strokeStyle=INK;ctx.lineWidth=1.3;hull();ctx.fill();ctx.stroke();
ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(18,0);ctx.stroke();
follow.forEach((f,k)=>{ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(-13+(k%6)*5.2,-3.2+Math.floor(k/6)*6.4,f.s>.9?2.3:1.9,0,6.3);ctx.fill()});
const a=-S.h,sd=Math.sin(a)>=0?1:-1,phi=Math.min(1.25,.18+Math.abs(Math.sin(a))*1.05*windOn),ang=Math.PI-sd*phi,L=24;
const ex=2+Math.cos(ang)*L,ey=Math.sin(ang)*L,ux=Math.cos(ang),uy=Math.sin(ang);let px=-uy,py=ux;if(px*Math.cos(a)+py*Math.sin(a)<0){px=-px;py=-py}
const bl=(1.5+(2.5+7*Math.abs(Math.sin(a))+2.5*Math.sin(t*5))*windOn)*gust,mx=(2+ex)/2,my=ey/2;
ctx.lineWidth=1.1;ctx.beginPath();ctx.moveTo(2,0);ctx.quadraticCurveTo(mx+px*bl,my+py*bl,ex,ey);ctx.quadraticCurveTo(mx+px*bl*.3,my+py*bl*.3,2,0);ctx.fillStyle='rgba(255,255,255,.95)';ctx.fill();ctx.stroke();
ctx.fillStyle=INK;ctx.beginPath();ctx.arc(2,0,2.6,0,6.3);ctx.fill();ctx.restore()}
const WS=[];for(let i=0;i<34;i++)WS.push({x:Math.random(),y:Math.random(),l:20+Math.random()*34,v:90+Math.random()*130,ph:Math.random()*6});
function render(dt){
if(mode==='dive'){renderDive(dt);return}
ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#f2f0ea';ctx.fillRect(0,0,W,H);
ctx.setTransform(dpr*zoom,0,0,dpr*zoom,dpr*(W/2-cam.x*zoom),dpr*(H/2-cam.y*zoom));
const x0=cam.x-W/2/zoom,y0=cam.y-H/2/zoom,vw=W/zoom,vh=H/zoom,C=110;
ctx.strokeStyle='rgba(50,52,58,.2)';ctx.lineWidth=1;ctx.beginPath();
for(let gx=Math.floor(x0/C)-1;gx<=(x0+vw)/C;gx++)for(let gy=Math.floor(y0/C)-1;gy<=(y0+vh)/C;gy++){const h=hash(gx,gy);if(h<.5)continue;const h2=hash(gy,gx),x=gx*C+h*C+Math.sin(t*.6+h2*9)*4,y=gy*C+h2*C,w=14+h*18;ctx.moveTo(x,y);ctx.quadraticCurveTo(x+w/2,y-4,x+w,y);ctx.moveTo(x+6,y+8);ctx.quadraticCurveTo(x+w/2+4,y+5,x+w*.8,y+8)}
ctx.stroke();
DATA.islands.forEach(i=>{if(Math.abs(i.x-cam.x)<vw/2+i.r*1.8&&Math.abs(i.y-cam.y)<vh/2+i.r*1.8)drawIsland(i)});
DATA.creatures.forEach(k=>{ctx.save();ctx.translate(k.x,k.y+Math.sin(t*1.8+k.ph)*2);ctx.rotate(k.a);ctx.scale(k.s,k.s);ctx.lineWidth=1.2;ctx.strokeStyle=INK;ctx.lineCap='butt';
ctx.fillStyle='rgba(0,0,0,.06)';ctx.beginPath();ctx.ellipse(4,7,22,13,0,0,6.3);ctx.fill();ART[k.type](k,t);ctx.restore()});
ctx.lineWidth=1;S.wake.forEach(w=>{ctx.strokeStyle='rgba(38,38,42,'+(1-w.a/3)*.3+')';ctx.beginPath();ctx.arc(w.x,w.y,3+w.a*9,0,6.3);ctx.stroke()});
drawShip();drawExtras();
ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
ctx.drawImage(fog,(x0-FO)/FS,(y0-FO)/FS,vw/FS,vh/FS,x0,y0,vw,vh);
ctx.setTransform(dpr,0,0,dpr,0,0);ctx.strokeStyle='rgba(40,40,46,'+(.05+.2*windOn)+')';ctx.lineWidth=1;ctx.beginPath();
WS.forEach(w=>{w.x+=(w.v*gust*(.25+.75*windOn)-S.vx*zoom*.5)*dt/W;w.y-=S.vy*zoom*.3*dt/H;w.x-=Math.floor(w.x);w.y-=Math.floor(w.y);const x=w.x*W,y=w.y*H;ctx.moveTo(x,y);ctx.quadraticCurveTo(x+w.l/2,y+Math.sin(t*2+w.ph)*3,x+w.l,y)});ctx.stroke();
{let bi=null,bd=1e9;DATA.islands.forEach(i=>{if(!i.found){const d=Math.hypot(i.x-S.x,i.y-S.y);if(d<bd){bd=d;bi=i}}});
if(bi){ctx.save();const sx=(S.x-cam.x)*zoom+W/2,sy=(S.y-cam.y)*zoom+H/2,an=Math.atan2(bi.y-S.y,bi.x-S.x),R=38*zoom+22,ca=Math.cos(an),sa=Math.sin(an);
ctx.strokeStyle=INK;ctx.globalAlpha=.25;ctx.lineWidth=1;ctx.setLineDash([2,5]);ctx.beginPath();ctx.arc(sx,sy,R,0,6.3);ctx.stroke();ctx.setLineDash([]);
ctx.save();ctx.translate(sx+ca*R,sy+sa*R);ctx.rotate(an);ctx.fillStyle=INK;ctx.globalAlpha=.8;ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(-5,-6);ctx.lineTo(-2,0);ctx.lineTo(-5,6);ctx.closePath();ctx.fill();ctx.restore();
const m=Math.max(0,Math.round((bd-bi.r)/10))+' m',tx=sx+ca*(R+28),ty=sy+sa*(R+28);ctx.font='italic 500 16px "Cormorant Garamond",Georgia,serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=4;ctx.strokeStyle='rgba(242,240,234,.85)';ctx.globalAlpha=.9;ctx.strokeText(m,tx,ty);ctx.fillStyle=INK;ctx.fillText(m,tx,ty);ctx.restore()}}
if(talk){const k=talk,w=Math.min(270,W*.72);bub.style.transform='translate('+clamp((k.x-cam.x)*zoom+W/2,w/2+12,W-w/2-12)+'px,'+clamp((k.y-cam.y)*zoom+H/2-48*zoom,170,H-40)+'px) translate(-50%,-100%)'}}
let last=performance.now();reveal(S.x,S.y);
function frame(n){const dt=Math.min(.05,(n-last)/1000);last=n;t+=dt;if(!deck.classList.contains('on')&&!welcomeOn)update(dt);render(dt);ui();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
